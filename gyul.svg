<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="skin" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#ffc24a"/>
      <stop offset=".45" stop-color="#ff9a1a"/>
      <stop offset=".85" stop-color="#e06a00"/>
      <stop offset="1" stop-color="#b84f00"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000" stop-opacity=".35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shine" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fbf55"/>
      <stop offset="1" stop-color="#2d7a34"/>
    </linearGradient>
    <filter id="pores" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .55  0 0 0 0 .25  0 0 0 0 0  0 0 0 .55 -.15"/>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
  </defs>

  <ellipse cx="100" cy="182" rx="62" ry="10" fill="url(#shadow)"/>

  <!-- 귤 몸통: 위아래가 살짝 눌린 모양 -->
  <path id="body" d="M100 44 C150 40 184 76 182 118 C180 158 146 180 100 180 C54 180 20 158 18 118 C16 76 50 40 100 44Z" fill="url(#skin)"/>
  <!-- 껍질의 오돌토돌한 질감 -->
  <path d="M100 44 C150 40 184 76 182 118 C180 158 146 180 100 180 C54 180 20 158 18 118 C16 76 50 40 100 44Z" fill="#fff" filter="url(#pores)"/>

  <!-- 빛 반사 -->
  <ellipse cx="62" cy="84" rx="26" ry="16" fill="url(#shine)" transform="rotate(-28 62 84)"/>
  <ellipse cx="150" cy="150" rx="22" ry="10" fill="#ffd27a" opacity=".25" transform="rotate(-30 150 150)"/>

  <!-- 꼭지 쪽 오목한 부분 -->
  <ellipse cx="100" cy="50" rx="20" ry="7" fill="#a84a00" opacity=".55"/>

  <!-- 꼭지와 잎 -->
  <path d="M97 50 q-2 -14 4 -20" stroke="#5a3a1a" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M100 48 C84 46 70 52 64 58 C78 62 92 58 100 48Z" fill="url(#leaf)"/>
  <path d="M100 48 C118 40 136 44 144 52 C128 58 110 56 100 48Z" fill="url(#leaf)"/>
  <path d="M100 48 C96 38 100 28 108 22 C112 32 108 42 100 48Z" fill="url(#leaf)"/>
  <path d="M100 48 C86 50 76 54 68 58" stroke="#245f2a" stroke-width="1.2" fill="none" opacity=".6"/>
  <path d="M100 48 C116 46 130 50 140 52" stroke="#245f2a" stroke-width="1.2" fill="none" opacity=".6"/>
</svg>
